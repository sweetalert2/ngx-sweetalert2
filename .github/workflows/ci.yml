name: build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    if: "!contains(github.event.commits[0].message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # to be able to publish a GitHub release
      issues: write # to be able to comment on released issues
      pull-requests: write # to be able to comment on released pull requests
      id-token: write # to enable use of OIDC for trusted publishing and npm provenance

    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build library package
        run: bun run build:lib --configuration=production

      - name: Copy readme and license files
        run: bun run build:copy-files

      - name: Run library tests
        run: bun run test:lib --configuration=ci

      - name: Run demo app tests
        run: bun run test:demo --configuration=ci

      - name: Show package.json
        run: cat dist/ngx-sweetalert2/package.json

      - name: Build library package for publishing
        run: bun run build:lib --configuration production

      - name: Run automated release process with semantic-release
        if: github.event_name == 'push' && contains(github.ref, 'main')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run semantic-release
